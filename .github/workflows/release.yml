name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v3.2.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create and push tag
        run: |
          VERSION="${{ inputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, checking it out"
            git checkout "$VERSION"
          else
            echo "Creating tag $VERSION on current HEAD"
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Build Worker
        working-directory: worker
        run: |
          npm ci
          npm run build

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package Release
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p release/worker release/frontend
          cp worker/dist/worker.js release/worker/worker.js
          cp -r frontend/dist/* release/frontend/
          cd release
          zip -r ../cloud-nine-${VERSION}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: cloud-nine-${{ inputs.version }}.zip
          generate_release_notes: true
