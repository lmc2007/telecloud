name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v3.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Worker
        working-directory: worker
        run: |
          npm ci
          npm run build

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package Release
        run: |
          mkdir -p release/worker release/frontend
          cp worker/dist/worker.js release/worker/worker.js
          cp -r frontend/dist/* release/frontend/
          cd release
          zip -r ../cloud-nine-${{ steps.ver.outputs.version }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          files: cloud-nine-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
