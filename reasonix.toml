[permissions]
allow = ["Bash=cd /tmp && node -e \"\nconst crypto = require('crypto');\n\n// 模拟: 100MB 文件, 45MB 卷, 前端 1MB 帧, 服务端 5MB 阈值 / 15MB cap flush\nconst VOLUME = 45*1024*1024, BUF = 1024*1024, MAX_FLUSH = 15*1024*1024, FLUSH_THRESHOLD = 5*1024*1024;\nconst fileSize = 100 * 1024 * 1024;\n\n// 生成随机文件(用 hash 表示每个 1MB 帧的内容, 加速)\n// 每个帧一个 'content' 标识\nconst frameContent = [];\nfor (let o = 0; o < fileSize; o += BUF) {\n  frameContent.push(crypto.createHash('sha256').update('frame' + Math.floor(o/BUF)).digest('hex'));\n}\n\n// ===== 模拟 WS 上传(服务端) =====\n// 每卷独立 WS 连接: state 独立\nfunction simulateVolume(vi, vs, ve) {\n  const state = { chunks: [], bytes: 0, received: 0, volumeIndex: vi, fileIds: [] };\n  const flush = () => {\n    if (state.chunks.length === 0) return;\n    let takeBytes = 0, takeCount = 0;\n    for (let i = 0; i < state.chunks.length; i++) {\n      const chunkSize = state.chunks[i].size;\n      if (takeCount > 0 && takeBytes + chunkSize > MAX_FLUSH) break;\n      takeBytes += chunkSize; takeCount++;\n    }\n    const toSend = state.chunks.splice(0, takeCount);\n    state.bytes -= takeBytes;\n    const partIdx = state.fileIds.length;\n    // TG 存储该 flush, 返回 file_id\n    state.fileIds.push({ index: state.volumeIndex * 100 + partIdx, file_id: 'fid_v' + vi + '_p' + partIdx });\n  };\n  // 模拟前端发帧\n  for (let o = vs; o < ve; o += BUF) {\n    const sz = Math.min(BUF, ve - o);\n    state.chunks.push({ size: sz, content: frameContent[Math.floor(o/BUF)] });\n    state.bytes += sz; state.received += sz;\n    if (state.bytes >= FLUSH_THRESHOLD) flush();\n  }\n  // volume_done → drain\n  while (state.chunks.length > 0) flush();\n  return state.fileIds;\n}\n\n// 前端: 按卷收集\nconst vols = Math.ceil(fileSize / VOLUME);\nconst all = [];\nfor (let vi = 0; vi < vols; vi++) {\n  const vs = vi*VOLUME, ve = Math.min((vi+1)*VOLUME, fileSize);\n  const ids = simulateVolume(vi, vs, ve);\n  all.push(...ids);\n}\nconsole.log('卷数:', vols, '总 flush 数:', all.length);\n\n// ===== 服务端 handleUploadComplete: sort by index =====\nall.sort((a,b) => a.index - b.index);\n// 排序后映射到实际帧内容\nconst orderedContents = all.map(id => {\n  // 从 file_id 反推卷和 part\n  const m = id.file_id.match(/fid_v(\\d+)_p(\\d+)/);\n  const vi = +m[1], p = +m[2];\n  // 需要模拟该 flush 包含哪些帧: 重放\n  const vs = vi*VOLUME, ve = Math.min((vi+1)*VOLUME, fileSize);\n  const frames = [];\n  let bytes = 0;\n  for (let o = vs; o < ve; o += BUF) {\n    frames.push({sz: Math.min(BUF, ve-o), content: frameContent[Math.floor(o/BUF)]});\n    bytes += frames[frames.length-1].sz;\n    if (bytes >= FLUSH_THRESHOLD) { if (frames.length - 1 === p) return frames.map(f=>f.content); bytes = 0; frames.length = 0; }\n  }\n  // 最后一段\n  return frames.map(f=>f.content);\n}).flat();\n\n// 验证顺序是否等于原始帧顺序\nconst expected = frameContent.slice(0, Math.ceil(fileSize/BUF));\nlet mismatches = 0;\nfor (let i = 0; i < orderedContents.length; i++) {\n  if (orderedContents[i] !== expected[i]) mismatches++;\n}\nconsole.log('原始帧数:', expected.length, '拼接帧数:', orderedContents.length, '错位帧数:', mismatches);\nconsole.log(mismatches === 0 ? '✓ 顺序正确: 卷0全部 → 卷1全部 → 卷2全部' : '✗ 顺序错乱(交错)');\n\"", "Bash=cd /tmp && node -e \"\nconst crypto = require('crypto');\n\nconst VOLUME = 45*1024*1024, BUF = 1024*1024, MAX_FLUSH = 15*1024*1024, FLUSH_THRESHOLD = 5*1024*1024;\nconst fileSize = 100 * 1024 * 1024;\nconst frameContent = [];\nfor (let o = 0; o < fileSize; o += BUF) frameContent.push('frame' + Math.floor(o/BUF));\n\n// ===== 模拟 WS 上传: 每个 flush 记录其帧序列 =====\nfunction simulateVolume(vi, vs, ve) {\n  const state = { chunks: [], bytes: 0, received: 0, volumeIndex: vi, fileIds: [] };\n  const flush = () => {\n    if (state.chunks.length === 0) return;\n    let takeBytes = 0, takeCount = 0;\n    for (let i = 0; i < state.chunks.length; i++) {\n      const chunkSize = state.chunks[i].sz;\n      if (takeCount > 0 && takeBytes + chunkSize > MAX_FLUSH) break;\n      takeBytes += chunkSize; takeCount++;\n    }\n    const toSend = state.chunks.splice(0, takeCount);\n    state.bytes -= takeBytes;\n    const partIdx = state.fileIds.length;\n    state.fileIds.push({ index: state.volumeIndex * 100 + partIdx, frames: toSend.map(c=>c.content), file_id: 'fid_v' + vi + '_p' + partIdx });\n  };\n  for (let o = vs; o < ve; o += BUF) {\n    const sz = Math.min(BUF, ve - o);\n    state.chunks.push({ sz, content: frameContent[Math.floor(o/BUF)] });\n    state.bytes += sz; state.received += sz;\n    if (state.bytes >= FLUSH_THRESHOLD) flush();\n  }\n  while (state.chunks.length > 0) flush();\n  return state.fileIds;\n}\n\nconst vols = Math.ceil(fileSize / VOLUME);\nconst all = [];\nfor (let vi = 0; vi < vols; vi++) {\n  const vs = vi*VOLUME, ve = Math.min((vi+1)*VOLUME, fileSize);\n  all.push(...simulateVolume(vi, vs, ve));\n}\nconsole.log('卷数:', vols, '总 flush 数:', all.length, '每卷 flush 数:', all.filter(x=>x.index<100).length, all.filter(x=>x.index>=100&&x.index<200).length, all.filter(x=>x.index>=200).length);\n\n// ===== handleUploadComplete: sort by index, 取 file_id =====\nall.sort((a,b) => a.index - b.index);\n// 用 file_id 反查 frames(模拟: file_id -> 卷/part)\nconst fidToFrames = {};\nfor (const x of all) fidToFrames[x.file_id] = x.frames;\nconst ordered = all.map(x => fidToFrames[x.file_id]).flat();\n\n// 验证拼接后是否等于原始帧顺序\nconst expected = frameContent;\nlet mism = 0, firstMism = -1;\nfor (let i = 0; i < ordered.length; i++) if (ordered[i] !== expected[i]) { mism++; if (firstMism<0) firstMism=i; }\nconsole.log('拼接帧数:', ordered.length, '错位帧数:', mism, '首个错位位置:', firstMism);\nconsole.log(mism === 0 ? '✓ 顺序正确(卷0→卷1→卷2)' : '✗ 顺序错乱');\n\n// 打印排序后的 index 序列\nconsole.log('排序后 index 序列:', all.map(x=>x.index).join(','));\n\""]
